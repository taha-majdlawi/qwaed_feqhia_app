name: qawaid_fiqhiyya
description: "القواعد الفقهية وتطبيقاتها — الشيخ الدكتور عدنان بن عوض الرشيدي"
publish_to: 'none'

version: 1.0.4+5

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  audio_session: ^0.2.4
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  dio: ^5.11.1
  collection: ^1.19.1
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  provider: ^6.1.5+1
  just_audio_media_kit: ^2.1.0
  media_kit_libs_windows_audio: ^1.0.9
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/
    - assets/data/sync/
    - assets/data/text/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/icon_square.png"
  min_sdk_android: 23
  adaptive_icon_background: "#F7F3E8"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"
  windows:
    generate: true
    image_path: "assets/images/icon_square.png"
    icon_size: 256

flutter_native_splash:
  color: "#FEFCEF"
  background_image: assets/images/intro.jpg
  android: true
  ios: true
  web: false
  android_12:
    color: "#FEFCEF"
    image: assets/images/icon_foreground.png
